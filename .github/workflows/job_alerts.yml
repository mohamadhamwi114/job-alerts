name: job-alerts

on:
  schedule:
    # Backup timer. GitHub runs schedules "best effort" and often hours late on small repos,
    # so for on-time runs also trigger workflow_dispatch from cron-job.org (README Step 7).
    # Duplicate runs skip themselves (runtime.cloud_min_gap_minutes in config.toml).
    - cron: "7,37 * * * *"
  workflow_dispatch:   # manual "Run workflow" button, and the API call cron-job.org makes

concurrency:
  group: job-alerts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python job_alerts.py --runner cloud
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
