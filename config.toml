[notify]
# Send "No new jobs" when a whole run finds nothing new.
when_empty = true

[runtime]
# Cloud run is skipped if the laptop reported in more recently than this.
local_heartbeat_minutes = 45
block_alert_cooldown_hours = 6
# Pause between LinkedIn requests (random in this range). LinkedIn returns 429 if you go faster.
sleep_seconds = [4, 8]
rate_limit_backoff_seconds = 90
# Stop searching after this many minutes; the next run catches up the rest.
# Keep it below timeout-minutes in .github/workflows/job_alerts.yml.
max_run_minutes = 12
